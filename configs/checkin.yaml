# ============================================
# 签到功能配置
# 每个时段每人每天只能签到一次
# 时段按顺序匹配，跨午夜自动处理
# ============================================

checkin_periods:
  - name: "早上"
    start: "05:00"
    end:   "09:00"
    duration_hours: 2
  - name: "上午"
    start: "09:00"
    end:   "12:00"
    duration_hours: 3
  - name: "下午"
    start: "12:00"
    end:   "18:00"
    duration_hours: 2
  - name: "晚上"
    start: "18:00"
    end:   "05:00"
    duration_hours: 1
