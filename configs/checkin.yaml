# ============================================
# 签到功能配置
# 每天按班次划分，每班次每人每天只能签到一次
# 签到判定：当前时间落在该班次的到岗(arrive) ~ 离岗(leave) 区间
# ============================================

checkin_shifts:
  - name: "一班次"
    arrive: "07:40"       # 到岗时间
    leave: "09:20"        # 离岗时间
    duration_hours: 2     # 录入时长（小时）
  - name: "二班次"
    arrive: "09:50"
    leave: "12:20"
    duration_hours: 3
  - name: "三班次"
    arrive: "14:10"
    leave: "15:50"
    duration_hours: 2
  - name: "四班次"
    arrive: "16:20"
    leave: "18:00"
    duration_hours: 2
