# ============================================
# 签到功能配置
# 打卡式: 到岗发送 "XX楼已到" 签到, 离岗发送 "签退" 结算时长
# 时长在签退时入账; 只签到没签退 → 按 checkin_default_credit 兜底
# ============================================

# 漏签退统一兜底时长(小时)
checkin_default_credit: 2

# 签退需晚于签到的最短分钟数(防签到即签退刷时长); 0 表示不限制
checkin_min_minutes: 60

checkin_shifts:
  # 白天班次: 签到+签退齐全 → 记固定 duration_hours
  - name: "一班次"
    arrive: "07:40"       # 到岗/签到窗口开始
    leave: "09:20"        # 离岗/班次结束
    duration_hours: 2     # 固定录入时长(小时)
  - name: "二班次"
    arrive: "09:50"
    leave: "12:20"
    duration_hours: 3
  - name: "三班次"
    arrive: "14:10"
    leave: "15:50"
    duration_hours: 2
  - name: "四班次"
    arrive: "16:20"
    leave: "18:00"
    duration_hours: 2
  # 晚班: 单个班次, 时长按签退时刻分档(≤21:00 记2小时, ≤22:00 记3小时)
  # 签到窗口限制在 到岗 ~ 第一个档位时刻(21:00), 防止临散场才签到刷时长
  - name: "晚班"
    arrive: "19:20"
    leave: "22:00"
    leave_tiers:
      - { at: "21:00", hours: 2 }
      - { at: "22:00", hours: 3 }
